name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Create .env
        run: echo "GEMINI_API_KEY=placeholder" > .env

      - name: Create keystore
        run: keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -keyalg RSA -keysize 2048

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayPing-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
